[project]
name = "specwise-notebook"
version = "0.1.0"
description = "RAG pipeline and experimentation environment for SpecWise"
readme = "README.md"
authors = [
    { name = "EhsanSamy", email = "ehsansamy9@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[tool.uv.workspace]
members = [
    "backend",
]
