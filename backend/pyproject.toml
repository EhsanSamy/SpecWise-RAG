[project]
name = "specwise-backend"
version = "0.1.0"
description = "Backend API for SpecWise"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
]
